# Builds the YouMod debs from the branch it is run on and publishes them as a release
# (tag youmod-v<version>-<run>). "Build IPA with tweaks" injects the newest of these
# releases instead of compiling YouMod itself. Manual only, to spend Actions minutes on purpose.
name: Build YouMod
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouMod
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout YouMod
        uses: actions/checkout@v7
        with:
          path: YouMod

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      # Original from YTweaks
      - name: Get Theos commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/roothide/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: YouMod-26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
            git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
            tar -xJf YouMod/deps/iPhoneOS26.5.sdk.tar.xz -C "$THEOS/sdks"
            cd ${{ github.workspace }}/theos/vendor/logos
            git checkout a623700
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Fetch FFmpegKit (full GPL)
        env:
          GH_TOKEN: ${{ github.token }}
          FFMPEGKIT_RELEASE_REPO: ${{ github.repository }}
        run: bash YouMod/tools/fetch-ffmpegkit.sh

      - name: Fetch MobileVLCKit
        run: bash YouMod/tools/fetch-vlckit.sh

      # The IPA deb keeps FFmpegKit/MobileVLCKit out: cyan turns every .framework in a deb into a load
      # command on YouTube's executable. The IPA workflow copies them into the app's Frameworks instead.
      - name: Build YouMod
        run: |
          cd YouMod
          version="$(grep '^Version:' control | cut -d ' ' -f2)"
          echo "YOUMOD_VERSION=$version" >> $GITHUB_ENV
          echo "YOUMOD_TAG=youmod-v$version-${{ github.run_number }}" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless YOUMOD_BUNDLE_FFMPEG=0
          mv packages/*.deb "${{ github.workspace }}/$(grep '^Package:' control | cut -d ' ' -f2)_${version}_ipa.deb"
          make clean package DEBUG=0 FINALPACKAGE=1
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mv packages/*.deb ${{ github.workspace }}
          ls -lh ${{ github.workspace }}/*.deb

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.YOUMOD_TAG }}
          target_commitish: ${{ github.sha }}
          name: YouMod v${{ env.YOUMOD_VERSION }} (${{ github.run_number }})
          body: |
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            - `*_iphoneos-arm.deb` rootful, `*_iphoneos-arm64.deb` rootless, `*_iphoneos-arm64e.deb` roothide
            - `*_ipa.deb` rootless without FFmpegKit/MobileVLCKit, used by "Build IPA with tweaks"
          files: ${{ github.workspace }}/*.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
